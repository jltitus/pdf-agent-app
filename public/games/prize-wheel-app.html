<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Food preservation trivia</title>
<style>
  :root {
    --osu-orange: #d73f09;
    --ink: #222;
    --bg: #f7f4ef;
    --panel: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .app { height: 100vh; display: flex; flex-direction: column; }
  header {
    background: var(--osu-orange); color: #fff;
    padding: 10px 20px; display: flex; align-items: center; justify-content: space-between;
    flex: 0 0 auto;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
  header .sub { font-size: 12px; opacity: .9; text-transform: uppercase; letter-spacing: .15em; }
  .score { font-size: 15px; font-weight: 700; display: flex; gap: 14px; align-items: center; }
  .score button {
    background: rgba(255,255,255,.18); color:#fff; border: none; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  .left { flex: 1 1 50%; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; }
  .right { flex: 1 1 50%; display: flex; flex-direction: column; padding: 20px 28px 20px 8px; min-height: 0; }

  /* Wheel */
  .wheel-wrap { position: relative; width: min(46vw, 70vh); aspect-ratio: 1; }
  canvas#wheel { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 18px rgba(0,0,0,.18)); }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent;
    border-top: 30px solid var(--ink); z-index: 5;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.3));
  }
  .hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 22%; aspect-ratio: 1; border-radius: 50%; background: #fff; border: 5px solid var(--osu-orange);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 800; color: var(--osu-orange); font-size: clamp(11px, 1.4vw, 16px); z-index: 4;
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.18);
  }
  .hub:active { transform: translate(-50%,-50%) scale(.96); }
  .hub.disabled { opacity: .5; pointer-events: none; }

  /* Right panel states */
  .card {
    background: var(--panel); border-radius: 20px; box-shadow: 0 6px 22px rgba(0,0,0,.10);
    padding: 24px 26px; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; overflow: auto;
  }
  .topic-band { height: 12px; border-radius: 8px; margin-bottom: 14px; }
  .eyebrow { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; }
  .muted { color: #777; }
  .big { font-size: clamp(20px, 2.4vw, 30px); font-weight: 800; line-height: 1.2; margin: 8px 0 4px; }

  .tier-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .tier-btn {
    border: 3px solid #e3ddd2; background: #fff; border-radius: 16px; padding: 22px 16px;
    font-size: 20px; font-weight: 800; cursor: pointer; color: var(--ink); transition: transform .06s;
  }
  .tier-btn small { display:block; font-weight:600; font-size:13px; color:#888; margin-top:4px; }
  .tier-btn:active { transform: scale(.97); }

  .q-text { font-size: clamp(20px, 2.5vw, 30px); font-weight: 800; line-height: 1.25; margin: 6px 0 16px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    text-align: left; border: 3px solid #e3ddd2; background: #fff; border-radius: 14px;
    padding: 16px 18px; font-size: 18px; font-weight: 600; cursor: pointer; color: var(--ink);
  }
  .opt:active { transform: scale(.99); }
  .opt.correct { border-color: #2e7d32; background: #eaf5ea; }
  .opt.wrong { border-color: #c62828; background: #fdeaea; }
  .opt:disabled { cursor: default; }

  .reveal { margin-top: 14px; }
  .answer { font-size: 20px; font-weight: 800; color: #2e7d32; }
  .funfact { margin-top: 10px; font-size: 16px; font-style: italic; color: #555; }
  .source { margin-top: 12px; font-size: 12px; color: #999; }

  .btn {
    border: none; border-radius: 14px; padding: 16px 22px; font-size: 18px; font-weight: 800;
    cursor: pointer; color: #fff; background: var(--osu-orange);
  }
  .btn.secondary { background: #6b6258; }
  .btn:active { transform: scale(.98); }
  .row { display: flex; gap: 12px; margin-top: auto; padding-top: 16px; }
  .center { text-align: center; }
  .hint { color: #888; font-size: 16px; margin-top: 10px; }
  .spin-hint { position:absolute; bottom: 18px; left:0; right:0; text-align:center; color:#999; font-size:14px; }
  @media (max-width: 820px), (orientation: portrait) {
    main { flex-direction: column; }
    .wheel-wrap { width: min(80vw, 44vh); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="sub">Oregon State University Extension</div>
      <h1>Food preservation trivia</h1>
    </div>
    <div class="score">
      <span id="scoreLabel">Correct: 0 / 0</span>
      <button id="resetScore">Reset</button>
    </div>
  </header>
  <main>
    <div class="left">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
        <div class="hub" id="spinBtn">SPIN</div>
      </div>
      <div class="spin-hint">Tap SPIN (or the wheel) to choose a topic</div>
    </div>
    <div class="right">
      <div class="card" id="panel"><!-- dynamic --></div>
    </div>
  </main>
</div>

<script>
window.__EMBEDDED_QUESTIONS__ = null;
</script>
<script>
(function () {
  "use strict";

  // --- topics (must match the wheel wedges / colors) ---
  var TOPICS = [
    { id: "food-safety", name: "Food Safety", color: "#D32F2F" },
    { id: "canning-fruits", name: "Canning Fruits", color: "#F57C00" },
    { id: "canning-tomatoes-salsas", name: "Canning Tomatoes & Salsas", color: "#E64A19" },
    { id: "low-acid-foods", name: "Low Acid Foods", color: "#7B1FA2" },
    { id: "pickling", name: "Pickling", color: "#388E3C" },
    { id: "jams-jellies", name: "Jams & Jellies", color: "#C2185B" },
    { id: "freezing-cold-storage", name: "Freezing & Cold Storage", color: "#1976D2" },
    { id: "dehydrating-smoking", name: "Dehydrating & Smoking", color: "#5D4037" }
  ];
  var TIERS = [
    { id: "kids", label: "Kids", sub: "under 10" },
    { id: "tweens", label: "Tweens", sub: "10–14" },
    { id: "teens", label: "Teens", sub: "14–18" },
    { id: "adults", label: "Adults", sub: "" }
  ];

  var QUESTIONS = [];
  var usedIds = {};      // id -> true
  var score = { correct: 0, total: 0 };
  var state = { topic: null, tier: null, question: null, answered: false };

  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var panel = document.getElementById("panel");
  var spinBtn = document.getElementById("spinBtn");
  var N = TOPICS.length;
  var rotation = 0;        // radians
  var spinning = false;

  // --- load questions (embedded for offline, else fetch) ---
  function loadQuestions() {
    if (window.__EMBEDDED_QUESTIONS__ && window.__EMBEDDED_QUESTIONS__.length) {
      return Promise.resolve(window.__EMBEDDED_QUESTIONS__);
    }
    return fetch("questions.json", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("questions.json " + r.status);
      return r.json();
    });
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // --- wheel drawing ---
  function drawWheel() {
    var size = canvas.width, r = size / 2, cx = r, cy = r;
    ctx.clearRect(0, 0, size, size);
    var arc = (Math.PI * 2) / N;
    for (var i = 0; i < N; i++) {
      var start = rotation + i * arc;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r - 6, start, start + arc);
      ctx.closePath();
      ctx.fillStyle = TOPICS[i].color;
      ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.stroke();

      // label
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + arc / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = "700 20px -apple-system, Helvetica, Arial, sans-serif";
      var words = TOPICS[i].name.split(" ");
      var lines = [];
      var line = "";
      for (var w = 0; w < words.length; w++) {
        var test = line ? line + " " + words[w] : words[w];
        if (test.length > 12 && line) { lines.push(line); line = words[w]; }
        else line = test;
      }
      if (line) lines.push(line);
      var ly = -((lines.length - 1) * 11);
      for (var L = 0; L < lines.length; L++) {
        ctx.fillText(lines[L], r - 22, ly + L * 22 + 7);
      }
      ctx.restore();
    }
    // outer ring
    ctx.beginPath(); ctx.arc(cx, cy, r - 5, 0, Math.PI * 2);
    ctx.lineWidth = 8; ctx.strokeStyle = "#d73f09"; ctx.stroke();
  }

  // index under the pointer (pointer at top = -90deg)
  function topicAtPointer() {
    var arc = (Math.PI * 2) / N;
    var pointerAngle = (-Math.PI / 2 - rotation) % (Math.PI * 2);
    if (pointerAngle < 0) pointerAngle += Math.PI * 2;
    var idx = Math.floor(pointerAngle / arc) % N;
    return TOPICS[idx];
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.classList.add("disabled");
    var target = rotation + Math.PI * (8 + Math.random() * 6) + Math.random() * Math.PI * 2;
    var startRot = rotation;
    var delta = target - startRot;
    var dur = 4200, t0 = null;
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      rotation = startRot + delta * easeOut(p);
      drawWheel();
      if (p < 1) requestAnimationFrame(frame);
      else {
        spinning = false;
        spinBtn.classList.remove("disabled");
        state.topic = topicAtPointer();
        renderTierSelect();
      }
    }
    requestAnimationFrame(frame);
  }

  // --- panel renderers ---
  function renderIntro() {
    panel.innerHTML =
      '<div class="center" style="margin:auto">' +
      '<div class="eyebrow" style="color:var(--osu-orange)">How to play</div>' +
      '<div class="big">Spin the wheel!</div>' +
      '<p class="hint">1. Tap <b>SPIN</b> to land on a food-preservation topic.<br>' +
      '2. Pick the player\'s age group.<br>' +
      '3. Answer the trivia question and learn a fun fact!</p>' +
      '</div>';
  }

  function pickColor() { return state.topic ? state.topic.color : "#d73f09"; }

  function renderTierSelect() {
    var html =
      '<div class="topic-band" style="background:' + pickColor() + '"></div>' +
      '<div class="eyebrow" style="color:' + pickColor() + '">Topic</div>' +
      '<div class="big">' + state.topic.name + '</div>' +
      '<p class="muted">Who is playing? Pick an age group:</p>' +
      '<div class="tier-grid">';
    TIERS.forEach(function (t) {
      html += '<button class="tier-btn" data-tier="' + t.id + '">' + t.label +
        (t.sub ? '<small>' + t.sub + '</small>' : '<small>&nbsp;</small>') + '</button>';
    });
    html += '</div>';
    panel.innerHTML = html;
    Array.prototype.forEach.call(panel.querySelectorAll(".tier-btn"), function (b) {
      b.addEventListener("click", function () {
        state.tier = TIERS.filter(function (x) { return x.id === b.getAttribute("data-tier"); })[0];
        showQuestion();
      });
    });
  }

  function pickQuestion(topicId, tierId) {
    var pool = QUESTIONS.filter(function (q) {
      return q.topic_id === topicId && q.tier_id === tierId && !usedIds[q.id];
    });
    if (!pool.length) {
      // all used — reset this bucket
      QUESTIONS.forEach(function (q) {
        if (q.topic_id === topicId && q.tier_id === tierId) delete usedIds[q.id];
      });
      pool = QUESTIONS.filter(function (q) { return q.topic_id === topicId && q.tier_id === tierId; });
    }
    if (!pool.length) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function showQuestion() {
    state.question = pickQuestion(state.topic.id, state.tier.id);
    state.answered = false;
    if (!state.question) {
      panel.innerHTML = '<div class="center" style="margin:auto"><div class="big">No questions for this group yet.</div>' +
        '<button class="btn" id="back">Spin again</button></div>';
      document.getElementById("back").addEventListener("click", renderIntro);
      return;
    }
    var q = state.question;
    usedIds[q.id] = true;
    var opts = shuffle([
      { text: q.correct_answer, correct: true },
      { text: q.wrong_answer_1, correct: false },
      { text: q.wrong_answer_2, correct: false }
    ]);
    var html =
      '<div class="topic-band" style="background:' + pickColor() + '"></div>' +
      '<div class="eyebrow" style="color:' + pickColor() + '">' + state.topic.name +
      ' &nbsp;·&nbsp; ' + state.tier.label + ' &nbsp;·&nbsp; ' + q.difficulty + '</div>' +
      '<div class="q-text">' + escapeHtml(q.question) + '</div>' +
      '<div class="options">';
    opts.forEach(function (o, i) {
      html += '<button class="opt" data-correct="' + (o.correct ? "1" : "0") + '" data-i="' + i + '">' +
        escapeHtml(o.text) + '</button>';
    });
    html += '</div><div class="reveal" id="reveal"></div>' +
      '<div class="row"><button class="btn secondary" id="skip">Reveal answer</button>' +
      '<button class="btn" id="next">Next spin →</button></div>';
    panel.innerHTML = html;

    Array.prototype.forEach.call(panel.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () { choose(b); });
    });
    document.getElementById("skip").addEventListener("click", function () { revealAnswer(false); });
    document.getElementById("next").addEventListener("click", function () { renderIntro(); });
  }

  function choose(btn) {
    if (state.answered) return;
    state.answered = true;
    var correct = btn.getAttribute("data-correct") === "1";
    score.total++;
    if (correct) score.correct++;
    updateScore();
    Array.prototype.forEach.call(panel.querySelectorAll(".opt"), function (b) {
      b.disabled = true;
      if (b.getAttribute("data-correct") === "1") b.classList.add("correct");
    });
    if (!correct) btn.classList.add("wrong");
    revealAnswer(correct);
  }

  function revealAnswer(answered) {
    var q = state.question;
    if (!state.answered) {
      state.answered = true;
      Array.prototype.forEach.call(panel.querySelectorAll(".opt"), function (b) {
        b.disabled = true;
        if (b.getAttribute("data-correct") === "1") b.classList.add("correct");
      });
    }
    var rev = document.getElementById("reveal");
    rev.innerHTML =
      '<div class="answer">✔ ' + escapeHtml(q.correct_answer) + '</div>' +
      '<div class="funfact">💡 ' + escapeHtml(q.fun_fact) + '</div>' +
      '<div class="source">Source: ' + escapeHtml(q.source_document) + '</div>';
  }

  function updateScore() {
    document.getElementById("scoreLabel").textContent =
      "Correct: " + score.correct + " / " + score.total;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  spinBtn.addEventListener("click", spin);
  canvas.addEventListener("click", spin);
  document.getElementById("resetScore").addEventListener("click", function () {
    score = { correct: 0, total: 0 }; updateScore();
  });

  drawWheel();
  renderIntro();
  loadQuestions().then(function (data) {
    QUESTIONS = data;
  }).catch(function (e) {
    panel.innerHTML = '<div class="center" style="margin:auto"><div class="big">Couldn\'t load questions</div>' +
      '<p class="hint">' + escapeHtml(e.message) + '</p></div>';
  });
})();
</script>
</body>
</html>
