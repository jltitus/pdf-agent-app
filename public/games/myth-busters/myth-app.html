<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Food preservation myth busters</title>
<style>
  :root { --osu-orange:#d73f09; --ink:#222; --bg:#f7f4ef; --true:#4A773C; --false:#D73F09; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); overflow:hidden; user-select:none; }
  .app { height:100vh; display:flex; flex-direction:column; }
  header { background:var(--osu-orange); color:#fff; padding:10px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; }
  header .sub { font-size:11px; opacity:.9; text-transform:uppercase; letter-spacing:.15em; }
  .controls { display:flex; gap:10px; align-items:center; font-size:15px; font-weight:700; flex-wrap:wrap; }
  select { font-size:15px; padding:6px 10px; border-radius:8px; border:none; font-weight:600; }
  .controls button { background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:700; cursor:pointer; }
  main { flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:20px; min-height:0; }
  .card { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.10); width:min(800px,95vw); max-height:86vh; overflow:auto; }
  .band { height:16px; border-radius:24px 24px 0 0; }
  .body { padding:24px 30px 28px; }
  .eyebrow { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.12em; }
  .topic { font-size:12px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:.08em; margin-top:6px; }
  .myth { font-size:clamp(22px,3vw,34px); font-weight:800; line-height:1.25; margin:8px 0 6px; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  .choice { border:4px solid #e3ddd2; background:#fff; border-radius:18px; padding:22px 10px; font-size:24px; font-weight:900; cursor:pointer; }
  .choice[data-k="TRUE"] { color:var(--true); }
  .choice[data-k="FALSE"] { color:var(--false); }
  .choice.pick-true { background:#eaf3e9; border-color:var(--true); }
  .choice.pick-false { background:#fdeee8; border-color:var(--false); }
  .choice.wrong { opacity:.5; }
  .choice:disabled { cursor:default; }
  .reveal { margin-top:18px; display:none; }
  .reveal.show { display:block; }
  .verdict { font-size:24px; font-weight:900; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .risk { font-size:13px; font-weight:800; border-radius:8px; padding:4px 10px; color:#fff; }
  .bust { margin-top:10px; font-size:17px; line-height:1.5; color:#333; }
  .why { margin-top:10px; font-size:14px; font-style:italic; color:#666; }
  .source { margin-top:10px; font-size:12px; color:#aaa; }
  .btn { border:none; border-radius:14px; padding:14px 26px; font-size:18px; font-weight:800; cursor:pointer; color:#fff; background:var(--osu-orange); margin-top:16px; }
  @media (orientation:portrait){ .choices{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="sub">Oregon State University Extension · MFP</div><h1>Food preservation myth busters</h1></div>
    <div class="controls">
      <select id="topicSel" aria-label="Filter by topic"></select>
      <span id="score">Busted: 0 / 0</span>
      <button id="reset">Reset</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<script>window.__EMBEDDED_MYTHS__ = null;</script>
<script>
(function(){
  "use strict";
  var RISK={LOW:"#6b7280",MEDIUM:"#F57C00",HIGH:"#C62828"};
  var VC={TRUE:"#4A773C",FALSE:"#D73F09"};
  var ITEMS=[], used={}, filter="all", score={c:0,t:0}, current=null, answered=false;
  var main=document.getElementById("main"), sel=document.getElementById("topicSel");

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function load(){ if(window.__EMBEDDED_MYTHS__&&window.__EMBEDDED_MYTHS__.length) return Promise.resolve(window.__EMBEDDED_MYTHS__);
    return fetch("myth-data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("data "+r.status);return r.json();}); }
  function pool(){ return ITEMS.filter(function(c){ return (filter==="all"||c.topic_id===filter)&&!used[c.myth_id]; }); }
  function pick(){ var p=pool(); if(!p.length){ ITEMS.forEach(function(c){ if(filter==="all"||c.topic_id===filter) delete used[c.myth_id]; }); p=pool(); } return p.length?p[Math.floor(Math.random()*p.length)]:null; }

  function render(){
    current=pick(); answered=false;
    if(!current){ main.innerHTML='<p>No myths.</p>'; return; }
    used[current.myth_id]=true; var c=current;
    main.innerHTML='<div class="card"><div class="band" style="background:'+esc(c.color)+'"></div><div class="body">'+
      '<div class="eyebrow" style="color:'+esc(c.color)+'">Myth or fact?</div>'+
      '<div class="topic">'+esc(c.topic)+'</div>'+
      '<div class="myth">"'+esc(c.myth_statement)+'"</div>'+
      '<div class="choices"><button class="choice" data-k="TRUE">TRUE</button><button class="choice" data-k="FALSE">FALSE</button></div>'+
      '<div class="reveal" id="reveal"></div>'+
      '<div><button class="btn" id="next" style="display:none">Next myth →</button></div>'+
    '</div></div>';
    Array.prototype.forEach.call(main.querySelectorAll(".choice"),function(b){ b.addEventListener("click",function(){choose(b);}); });
    document.getElementById("next").addEventListener("click",render);
  }
  function choose(btn){
    if(answered) return; answered=true;
    var k=btn.getAttribute("data-k"); var correct=k===current.answer;
    score.t++; if(correct) score.c++; document.getElementById("score").textContent="Busted: "+score.c+" / "+score.t;
    Array.prototype.forEach.call(main.querySelectorAll(".choice"),function(b){ b.disabled=true;
      var bk=b.getAttribute("data-k");
      if(bk===current.answer) b.classList.add(bk==="TRUE"?"pick-true":"pick-false");
      else b.classList.add("wrong");
    });
    var c=current, r=document.getElementById("reveal");
    r.innerHTML='<div class="verdict" style="color:'+VC[c.answer]+'">'+(correct?"✔ ":"")+'It\'s '+c.answer+
      ' <span class="risk" style="background:'+RISK[c.danger_level]+'">'+esc(c.danger_level)+' RISK</span></div>'+
      '<div class="bust">'+esc(c.bust_explanation)+'</div>'+
      (c.why_people_believe_it?'<div class="why">Why people believe it: '+esc(c.why_people_believe_it)+'</div>':'')+
      (c.source_document?'<div class="source">Source: '+esc(c.source_document)+'</div>':'');
    r.classList.add("show");
    document.getElementById("next").style.display="inline-block";
  }
  function buildFilter(){ var t={}; ITEMS.forEach(function(c){ t[c.topic_id]=c.topic; });
    sel.innerHTML='<option value="all">All topics</option>'+Object.keys(t).map(function(id){return '<option value="'+id+'">'+esc(t[id])+'</option>';}).join('');
    sel.addEventListener("change",function(){ filter=sel.value; render(); });
  }
  document.getElementById("reset").addEventListener("click",function(){ score={c:0,t:0}; document.getElementById("score").textContent="Busted: 0 / 0"; });
  load().then(function(d){ ITEMS=d; buildFilter(); render(); }).catch(function(e){ main.innerHTML='<p style="padding:30px">Couldn\'t load: '+esc(e.message)+'</p>'; });
})();
</script>
</body>
</html>
